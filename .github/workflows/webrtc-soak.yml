name: Native WebRTC soak matrix

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: WebRTC soak workload
        required: true
        default: ci
        type: choice
        options:
          - smoke
          - ci
          - soak

permissions:
  contents: read

jobs:
  native-webrtc:
    name: ${{ matrix.os }} / ${{ inputs.profile || 'soak' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run native WebRTC matrix
        shell: bash
        env:
          SOAK_PROFILE: ${{ inputs.profile || 'soak' }}
        run: |
          set -euo pipefail
          go run ./cmd/webrtc-soak \
            --profile "${SOAK_PROFILE}" \
            --report "artifacts/webrtc-soak-${RUNNER_OS}.json"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webrtc-soak-${{ runner.os }}
          path: artifacts/webrtc-soak-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 14
