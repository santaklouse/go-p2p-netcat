name: Native WebRTC soak matrix

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: WebRTC soak workload
        required: true
        default: ci
        type: choice
        options:
          - smoke
          - ci
          - soak

permissions:
  contents: read

jobs:
  native-webrtc:
    name: ${{ matrix.os }} / ${{ inputs.profile || 'soak' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run native WebRTC matrix
        shell: bash
        env:
          SOAK_PROFILE: ${{ inputs.profile || 'soak' }}
        run: |
          set -euo pipefail
          go run ./cmd/webrtc-soak \
            --profile "${SOAK_PROFILE}" \
            --report "artifacts/webrtc-soak-${RUNNER_OS}.json"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webrtc-soak-${{ runner.os }}
          path: artifacts/webrtc-soak-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 14
