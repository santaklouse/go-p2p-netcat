name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/p2p-nc ./cmd/pnc
      - name: Test deploy script
        if: runner.os != 'Windows'
        shell: bash
        run: bash deploy/deploy_test.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: packages/core
      - run: npm test
        working-directory: packages/core
      - run: npm run lint
        working-directory: packages/core
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
