name: Deploy p2p-netcat web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - packages/core/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            web/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install core dependencies
        run: npm ci
        working-directory: packages/core
      - name: Test core package
        run: npm test
        working-directory: packages/core
      - name: Lint core package
        run: npm run lint
        working-directory: packages/core
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Lint web package
        run: npm run lint
        working-directory: web
      - name: Build static PWA
        working-directory: web
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          account_name="${GITHUB_REPOSITORY%%/*}"
          if [[ "${repository_name}" == "${account_name}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository_name}/"
          fi
          VITE_BASE_PATH="${base_path}" npm run build -- --base "${base_path}"
      - name: Test deployed static site
        run: node --test tests/static-site.test.mjs
        working-directory: web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  deploy:
    name: Deploy PWA
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
