name: Deploy p2p-netcat web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            web/package-lock.json
      - uses: actions/configure-pages@v6.0.0
      - run: npm ci
        working-directory: packages/core
      - run: npm test
        working-directory: packages/core
      - run: npm run lint
        working-directory: packages/core
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: Build static PWA
        working-directory: web
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          account_name="${GITHUB_REPOSITORY%%/*}"
          if [[ "${repository_name}" == "${account_name}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository_name}/"
          fi
          VITE_BASE_PATH="${base_path}" npm run build -- --base "${base_path}"
      - run: node --test tests/static-site.test.mjs
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
