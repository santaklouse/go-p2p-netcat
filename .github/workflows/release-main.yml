name: Release main

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  verify-go:
    name: Verify Go release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify Go modules
        run: go mod verify
      - name: Run Go tests
        run: go test -count=1 -timeout=15m ./...
      - name: Run go vet
        run: go vet ./...

  verify-web:
    name: Verify browser release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            web/package-lock.json
      - name: Install and test core package
        working-directory: packages/core
        run: |
          npm ci
          npm test
          npm run lint
          npm pack --dry-run
      - name: Install and test web package
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm pack --dry-run

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify-go
      - verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            archive: tar.gz
            cgo: "0"
          - target: linux-arm64
            goos: linux
            goarch: arm64
            archive: tar.gz
            cgo: "0"
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            archive: tar.gz
            cgo: "0"
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            archive: tar.gz
            cgo: "0"
          - target: windows-amd64
            goos: windows
            goarch: amd64
            archive: zip
            cgo: "0"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            archive: zip
            cgo: "0"
          - target: android-arm64
            goos: android
            goarch: arm64
            archive: tar.gz
            cgo: "1"
            cc: aarch64-linux-android24-clang
          - target: android-armv7
            goos: android
            goarch: arm
            goarm: "7"
            archive: tar.gz
            cgo: "1"
            cc: armv7a-linux-androideabi24-clang
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM_VALUE: ${{ matrix.goarm }}
          ARCHIVE: ${{ matrix.archive }}
          CGO_ENABLED: ${{ matrix.cgo }}
          CC_NAME: ${{ matrix.cc }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="main-${GITHUB_SHA::12}"
          fi
          package="p2p-nc-${TARGET}"
          binary="p2p-nc"
          alias_binary="pnc"
          build_mode=()
          linker_flags="-s -w -X github.com/santaklouse/go-p2p-netcat/internal/cli.Version=$version"

          if [[ "$GOOS" == "windows" ]]; then
            binary="p2p-nc.exe"
            alias_binary="pnc.exe"
          fi

          if [[ "$GOOS" == "android" ]]; then
            export CC="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${CC_NAME}"
            if [[ -n "$GOARM_VALUE" ]]; then
              export GOARM="$GOARM_VALUE"
            fi
            build_mode=(-buildmode=pie)
            linker_flags="${linker_flags} -checklinkname=0"
          fi

          mkdir -p "dist/$package"
          go build \
            -trimpath \
            "${build_mode[@]}" \
            -ldflags="$linker_flags" \
            -o "dist/$package/$binary" \
            ./cmd/p2p-nc
          go build \
            -trimpath \
            "${build_mode[@]}" \
            -ldflags="$linker_flags" \
            -o "dist/$package/$alias_binary" \
            ./cmd/pnc
          cp LICENSE README.md README.RU.md "dist/$package/"
          go version -m "dist/$package/$binary"
          go version -m "dist/$package/$alias_binary"

          if [[ "$ARCHIVE" == "zip" ]]; then
            (
              cd dist
              zip -9 -r "$package.zip" "$package"
            )
            unzip -t "dist/$package.zip"
          else
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            tar -tzf "dist/$package.tar.gz" >/dev/null
          fi

          rm -rf "dist/$package"
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download release builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add installer
        shell: bash
        run: install -m 0755 deploy/deploy.sh dist/deploy.sh
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum p2p-nc-* deploy.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_flags=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            title="p2p-netcat $tag"
            release_flags=(--latest)
          else
            tag="main-${GITHUB_SHA::12}"
            title="p2p-netcat main build ${GITHUB_SHA::7}"
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" "${release_flags[@]}"
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              "${release_flags[@]}"
          fi
