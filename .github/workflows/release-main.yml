name: Release main

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  verify-go:
    name: Verify Go release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify Go modules
        run: go mod verify
      - name: Run Go tests
        run: go test -count=1 -timeout=15m ./...
      - name: Run go vet
        run: go vet ./...

  verify-web:
    name: Verify browser release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            web/package-lock.json
      - name: Install and test core package
        working-directory: packages/core
        run: |
          npm ci
          npm test
          npm run lint
          npm pack --dry-run
      - name: Install and test web package
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm pack --dry-run

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify-go
      - verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            archive: tar.gz
            cgo: "0"
          - target: linux-arm64
            goos: linux
            goarch: arm64
            archive: tar.gz
            cgo: "0"
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            archive: tar.gz
            cgo: "0"
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            archive: tar.gz
            cgo: "0"
          - target: windows-amd64
            goos: windows
            goarch: amd64
            archive: zip
            cgo: "0"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            archive: zip
            cgo: "0"
          - target: android-arm64
            goos: android
            goarch: arm64
            archive: tar.gz
            cgo: "1"
            cc: aarch64-linux-android24-clang
          - target: android-armv7
            goos: android
            goarch: arm
            goarm: "7"
            archive: tar.gz
            cgo: "1"
            cc: armv7a-linux-androideabi24-clang
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install UPX for Linux packages
        if: matrix.goos == 'linux'
        shell: bash
        env:
          UPX_VERSION: 5.2.0
          UPX_SHA256: 3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1
        run: |
          set -euo pipefail
          archive="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          url="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/${archive}" \
            "$url"
          printf '%s  %s\n' "$UPX_SHA256" "${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar -C "$RUNNER_TEMP" -xJf "${RUNNER_TEMP}/${archive}"
          mkdir -p "${RUNNER_TEMP}/upx-bin"
          install -m 0755 \
            "${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux/upx" \
            "${RUNNER_TEMP}/upx-bin/upx"
          "${RUNNER_TEMP}/upx-bin/upx" --version
          printf '%s\n' "${RUNNER_TEMP}/upx-bin" >> "$GITHUB_PATH"
      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM_VALUE: ${{ matrix.goarm }}
          ARCHIVE: ${{ matrix.archive }}
          CGO_ENABLED: ${{ matrix.cgo }}
          CC_NAME: ${{ matrix.cc }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="main-${GITHUB_SHA::12}"
          fi
          package="p2p-nc-${TARGET}"
          binary="p2p-nc"
          alias_binary="pnc"
          build_mode=()
          linker_flags="-s -w -X github.com/santaklouse/go-p2p-netcat/internal/cli.Version=$version"

          if [[ "$GOOS" == "windows" ]]; then
            binary="p2p-nc.exe"
            alias_binary="pnc.exe"
          fi

          if [[ "$GOOS" == "android" ]]; then
            export CC="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${CC_NAME}"
            if [[ -n "$GOARM_VALUE" ]]; then
              export GOARM="$GOARM_VALUE"
            fi
            build_mode=(-buildmode=pie)
            linker_flags="${linker_flags} -checklinkname=0"
          fi

          mkdir -p "dist/$package"
          go build \
            -trimpath \
            "${build_mode[@]}" \
            -ldflags="$linker_flags" \
            -o "dist/$package/$binary" \
            ./cmd/p2p-nc
          go build \
            -trimpath \
            "${build_mode[@]}" \
            -ldflags="$linker_flags" \
            -o "dist/$package/$alias_binary" \
            ./cmd/pnc
          cp LICENSE README.md README.RU.md "dist/$package/"
          go version -m "dist/$package/$binary"
          go version -m "dist/$package/$alias_binary"

          if [[ "$GOOS" == "linux" ]]; then
            deb_version="$version"
            if [[ "$version" == main-* ]]; then
              deb_version="0~$version"
            fi
            bash packaging/build-deb.sh \
              "$deb_version" \
              "$GOARCH" \
              "dist/$package" \
              dist

            if [[ "$GOARCH" == "amd64" ]]; then
              deb_root="${RUNNER_TEMP}/p2p-netcat-deb-root"
              dpkg-deb --extract \
                "dist/p2p-netcat_${deb_version}_${GOARCH}.deb" \
                "$deb_root"
              "$deb_root/usr/bin/p2p-nc" --version \
                | grep -Fqx "p2p-nc version $version"
              "$deb_root/usr/bin/pnc" --version \
                | grep -Fqx "p2p-nc version $version"
              "$deb_root/usr/bin/p2p-netcat" --version \
                | grep -Fqx "p2p-nc version $version"
            fi
          fi

          if [[ "$ARCHIVE" == "zip" ]]; then
            (
              cd dist
              zip -9 -r "$package.zip" "$package"
            )
            unzip -t "dist/$package.zip"
          else
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            tar -tzf "dist/$package.tar.gz" >/dev/null
          fi

          if [[ "$GOOS" == "linux" ]]; then
            packed_package="${package}-upx"
            cp -a "dist/$package" "dist/$packed_package"

            for executable in "$binary" "$alias_binary"; do
              original="dist/$package/$executable"
              packed="dist/$packed_package/$executable"
              unpacked="${RUNNER_TEMP}/${packed_package}-${executable}.unpacked"

              upx -qqq -9 "$packed"
              upx -qqq -t "$packed"
              upx -qqq -d "$packed" -o "$unpacked"
              cmp --silent "$original" "$unpacked"
              rm -f "$unpacked"
            done

            if [[ "$GOARCH" == "amd64" ]]; then
              "dist/$packed_package/$binary" --version \
                | grep -Fqx "p2p-nc version $version"
              "dist/$packed_package/$alias_binary" --version \
                | grep -Fqx "p2p-nc version $version"
            fi

            tar -C dist -czf "dist/$packed_package.tar.gz" "$packed_package"
            tar -tzf "dist/$packed_package.tar.gz" >/dev/null
            rm -rf "dist/$packed_package"
          fi

          rm -rf "dist/$package"
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download release builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add installer
        shell: bash
        run: |
          install -m 0755 deploy/deploy.sh dist/deploy.sh
          install -m 0755 deploy/wireguard-full-tunnel.sh dist/wireguard-full-tunnel.sh
      - name: Generate Homebrew formula
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          darwin_amd64_sha256="$(sha256sum dist/p2p-nc-darwin-amd64.tar.gz | awk '{print $1}')"
          darwin_arm64_sha256="$(sha256sum dist/p2p-nc-darwin-arm64.tar.gz | awk '{print $1}')"
          linux_amd64_sha256="$(sha256sum dist/p2p-nc-linux-amd64.tar.gz | awk '{print $1}')"
          linux_arm64_sha256="$(sha256sum dist/p2p-nc-linux-arm64.tar.gz | awk '{print $1}')"
          bash packaging/generate-homebrew-formula.sh \
            "$version" \
            "$darwin_amd64_sha256" \
            "$darwin_arm64_sha256" \
            "$linux_amd64_sha256" \
            "$linux_arm64_sha256" \
            dist/p2p-netcat.rb
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          artifacts=(p2p-nc-* p2p-netcat_*.deb deploy.sh wireguard-full-tunnel.sh)
          if [[ -f p2p-netcat.rb ]]; then
            artifacts+=(p2p-netcat.rb)
          fi
          sha256sum "${artifacts[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          artifacts=(p2p-nc-* p2p-netcat_*.deb deploy.sh wireguard-full-tunnel.sh SHA256SUMS)
          if [[ -f p2p-netcat.rb ]]; then
            artifacts+=(p2p-netcat.rb)
          fi
          for artifact in "${artifacts[@]}"; do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "${artifact}"
          done
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_flags=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            title="p2p-netcat $tag"
            release_flags=(--latest)
          else
            tag="main-${GITHUB_SHA::12}"
            title="p2p-netcat main build ${GITHUB_SHA::7}"
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" "${release_flags[@]}"
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              "${release_flags[@]}"
          fi

  container:
    name: Publish container to GHCR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      DOCKER_METADATA_SHORT_SHA_LENGTH: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=PeerId-addressed netcat with TCP and UDP forwarding
          build-args: VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=container-release
          cache-to: type=gha,mode=max,scope=container-release
          provenance: mode=max
          sbom: true
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
